<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="description" content="Plan a playful new playground, explore algebraic expressions, and bring your own design to life." />
    <title>Playground Design Lab · True PBL</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#lesson">Skip to the activity</a>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 32V18H12V10H16V6H24V10H28V18H32V32H8Z" fill="currentColor" />
            <path d="M12 18H28V22H12V18ZM17 26H23V36H17V26Z" fill="#d9e7cc" />
            <path d="M4 34H36V38H4V34Z" fill="currentColor" />
          </svg>
        </div>
        <div class="header-copy">
          <div class="eyebrow">TRUE PBL · PROJECT 2</div>
          <h1 class="app-title">Playground Design Lab</h1>
        </div>
        <div class="header-tools">
          <button id="open-menu" class="button quiet small" type="button" aria-haspopup="dialog">Lesson map</button>
          <button id="export-work" class="button secondary small" type="button">Save my work <span aria-hidden="true">↗</span></button>
        </div>
      </header>

      <nav id="chapter-nav" class="chapter-nav" aria-label="Lesson chapters">
        <button class="chapter active" type="button" data-chapter="0"><span class="chapter-number">01</span><span>The mission</span></button>
        <button class="chapter" type="button" data-chapter="1"><span class="chapter-number">02</span><span>Explore &amp; solve</span></button>
        <button class="chapter" type="button" data-chapter="2"><span class="chapter-number">03</span><span>Your big idea</span></button>
        <button class="chapter" type="button" data-chapter="3"><span class="chapter-number">04</span><span>Build &amp; share</span></button>
      </nav>

      <nav id="step-nav" class="step-nav" aria-label="Lesson pages">
        <button class="step active" type="button" data-page="0" aria-label="Page 1" aria-current="step">1</button>
        <button class="step" type="button" data-page="1" aria-label="Page 2">2</button>
        <button class="step" type="button" data-page="2" aria-label="Page 3">3</button>
        <button class="step" type="button" data-page="3" aria-label="Page 4">4</button>
        <button class="step" type="button" data-page="4" aria-label="Page 5">5</button>
        <button class="step" type="button" data-page="5" aria-label="Page 6">6</button>
        <button class="step" type="button" data-page="6" aria-label="Page 7">7</button>
        <button class="step" type="button" data-page="7" aria-label="Page 8">8</button>
        <button class="step" type="button" data-page="8" aria-label="Page 9">9</button>
        <button class="step" type="button" data-page="9" aria-label="Page 10">10</button>
        <button class="step" type="button" data-page="10" aria-label="Page 11">11</button>
        <button class="step" type="button" data-page="11" aria-label="Page 12">12</button>
        <button class="step" type="button" data-page="12" aria-label="Page 13">13</button>
        <button class="step" type="button" data-page="13" aria-label="Page 14">14</button>
      </nav>

      <main id="lesson" class="lesson-card" tabindex="-1" aria-label="Playground activity">
        <div class="loading-message">
          <div class="eyebrow">YOUR NEXT ADVENTURE</div>
          <h2>Welcome to the playground.</h2>
          <p>Getting your design desk ready…</p>
          <noscript><p>This local activity needs JavaScript. Enable JavaScript in your browser, then reload this page.</p></noscript>
        </div>
      </main>

      <footer class="page-navigation">
        <button id="previous" class="button secondary" type="button" disabled><span aria-hidden="true">←</span> Previous</button>
        <div class="page-meta">
          <span id="page-label">Page 1 of 14</span>
          <span id="save-label">Your progress stays on this device</span>
        </div>
        <button id="next" class="button primary" type="button">Next <span aria-hidden="true">→</span></button>
      </footer>
      <footer class="copyright">©TruePBL. All rights reserved.</footer>
    </div>
    <div id="dialog-root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
